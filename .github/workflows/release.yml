name: release

# Triggered when you push a tag like `v0.1.0`. Builds, tests, packs, and
# publishes the NuGet package, attaches the .nupkg to a GitHub Release, then
# publishes server.json to the MCP registry once NuGet has indexed the package.
#
# Neither needs a stored secret. A Trusted Publishing policy on nuget.org (owner
# Hyeonu-Cha, repo dotnet-coverage-mcp, workflow release.yml) lets this workflow
# trade its GitHub OIDC token for a key valid about an hour, and the MCP registry
# accepts the same token for the io.github.Hyeonu-Cha namespace.
#
# After that, a release is just:
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write # OIDC token for NuGet Trusted Publishing and the MCP registry

# Actions are pinned to a commit SHA, as in dotnet.yml: this workflow can push to NuGet and
# the registry, so a moved tag here would publish someone else's code under this name.

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the "tag is on main" check below can see origin/main.
          fetch-depth: 0
          # This job's token can write to the repo; nothing after checkout uses git, so
          # keep it out of .git/config, away from restore, build and test.
          persist-credentials: false

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Guards run before anything is built or published. NuGet versions cannot be
      # re-used, so a wrong tag is cheaper to reject here than to fix afterwards.
      - name: Check tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Check server.json version matches tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: jq -e --arg v "$VERSION" '.version == $v and .packages[0].version == $v' server.json

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Smoke-test the packed tool
        run: bash .github/scripts/smoke-test.sh

      - name: Pack
        # IsPacking=true activates the packaging PropertyGroup in the csproj.
        # During regular build/test we leave it off so PackAsTool=true doesn't
        # collide with the test project's ProjectReference.
        run: dotnet pack DotNetCoverageMcp.csproj --configuration Release -p:Version=${{ steps.version.outputs.version }} -p:IsPacking=true -o ./nupkg

      # Right before the push: the key it returns expires after about an hour.
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ericcha901 # nuget.org account that owns the package

      - name: Publish to NuGet
        run: dotnet nuget push "./nupkg/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./nupkg/*.nupkg --verify-tag --generate-notes

  # A job of its own so that, if it fails, "Re-run failed jobs" retries only this
  # part, not the NuGet push and the GitHub Release that already succeeded.
  mcp-registry:
    needs: release
    runs-on: ubuntu-latest
    # Up to 60 minutes waiting for NuGet, then a minute of work.
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write # `mcp-publisher login github-oidc`
    env:
      # Pinned and signature-checked, as the registry's guide recommends. Bump on purpose.
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The registry checks the package on NuGet, so it must be listed there first.
      # NuGet's validation and indexing usually take 5-20 minutes.
      - name: Wait for NuGet to index the package
        run: |
          version="${GITHUB_REF_NAME#v}"
          for _ in $(seq 1 120); do
            curl -fsS https://api.nuget.org/v3-flatcontainer/dotnet-coverage-mcp/index.json \
              | jq -e --arg v "$version" '.versions | index($v)' > /dev/null && exit 0
            sleep 30
          done
          echo "::error::NuGet had not indexed $version after 60 minutes. Re-run this job once it has."
          exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base_url/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      # Log in right before publishing: the registry token lasts only a few minutes.
      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
