name: release

# Triggered when you push a tag like `v0.1.0`. One job builds, tests, packs and writes an
# SBOM with a read-only token; the next attests both, publishes the NuGet package and attaches
# the .nupkg and SBOM to a GitHub Release. Once NuGet has indexed the package, a third job
# installs it from nuget.org and smoke-tests it, and a last one publishes server.json to the
# MCP registry.
#
# None needs a stored secret. A Trusted Publishing policy on nuget.org (owner
# Hyeonu-Cha, repo dotnet-coverage-mcp, workflow release.yml) lets this workflow
# trade its GitHub OIDC token for a key valid about an hour, and the MCP registry
# accepts the same token for the io.github.Hyeonu-Cha namespace.
#
# After that, a release is just:
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags:
      - "v*.*.*"

# Each job asks for the permissions it uses.
permissions:
  contents: read

# Actions are pinned to a commit SHA, as in dotnet.yml: this workflow can push to NuGet and
# the registry, so a moved tag here would publish someone else's code under this name.

jobs:
  # Restore, build and test run third-party code: MSBuild targets and the test packages, then
  # CycloneDX. Any step of a job holding id-token: write can mint the OIDC token that Trusted
  # Publishing trades for a NuGet key, so this job holds nothing it could publish with.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the "tag is on main" check below can see origin/main.
          fetch-depth: 0
          # Nothing after checkout uses git; keep the token out of .git/config, away from
          # restore, build and test.
          persist-credentials: false

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Guards run before anything is built or published. NuGet versions cannot be
      # re-used, so a wrong tag is cheaper to reject here than to fix afterwards.
      - name: Check tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Check server.json and plugin.json versions match tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq -e --arg v "$VERSION" '.version == $v and .packages[0].version == $v' server.json
          jq -e --arg v "$VERSION" '.version == $v' plugin/plugin.json

      # 8.0 for the end-to-end test of a test project that also targets net8.0.
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Smoke-test the packed tool
        run: bash .github/scripts/smoke-test.sh

      - name: Pack
        # IsPacking=true activates the packaging PropertyGroup in the csproj.
        # During regular build/test we leave it off so PackAsTool=true doesn't
        # collide with the test project's ProjectReference.
        # ContinuousIntegrationBuild maps the runner's source paths to /_/ in the shipped PDB,
        # so the package is reproducible and passes NuGet's deterministic-build check. Only
        # here: on regular CI builds coverlet would then fail to find the sources it measures.
        run: dotnet pack DotNetCoverageMcp.csproj --configuration Release -p:Version=${{ steps.version.outputs.version }} -p:IsPacking=true -p:ContinuousIntegrationBuild=true -o ./nupkg

      # CycloneDX list of what the package ships (MCP SDK, Roslyn, Hosting and their
      # dependencies), attached to the GitHub Release.
      - name: Generate SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet tool install CycloneDX --version 6.3.1 --tool-path "$RUNNER_TEMP/cyclonedx"
          "$RUNNER_TEMP/cyclonedx/dotnet-CycloneDX" DotNetCoverageMcp.csproj --output ./sbom \
            --output-format Json --filename "dotnet-coverage-mcp.$VERSION.cdx.json" \
            --set-name dotnet-coverage-mcp --set-version "$VERSION" --set-type Application \
            --exclude-dev --exclude-test-projects

      - name: Upload the package and SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            nupkg/*.nupkg
            sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 7

  # Holds the publishing rights and runs nothing but the publishing steps on the built files.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC token for NuGet Trusted Publishing and for signing attestations
      attestations: write # store the attestations
      artifact-metadata: write # the storage record actions/attest creates
    steps:
      - name: Download the package and SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      # Signed statements, kept by GitHub, that this .nupkg was built by this workflow from
      # this commit, and what its SBOM is. Before the push, so nothing unattested ships.
      # Checked with `gh attestation verify <nupkg> --repo Hyeonu-Cha/dotnet-coverage-mcp`
      # against the GitHub Release copy: nuget.org adds its own signature to the package,
      # which changes its bytes.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ./nupkg/*.nupkg

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ./nupkg/*.nupkg
          sbom-path: ./sbom/dotnet-coverage-mcp.${{ needs.build.outputs.version }}.cdx.json

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # Right before the push: the key it returns expires after about an hour.
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ericcha901 # nuget.org account that owns the package

      - name: Publish to NuGet
        run: dotnet nuget push "./nupkg/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./nupkg/*.nupkg ./sbom/*.cdx.json --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

  # The same smoke test as on every PR, but on the package users actually get: the one
  # nuget.org serves, with its signature added. A job of its own because it runs that
  # package's code, and so with no publishing rights; a broken package never reaches the registry.
  verify-nuget:
    needs: publish
    runs-on: ubuntu-latest
    # Up to 60 minutes waiting for NuGet, then a few minutes of work.
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The registry checks the package on NuGet, so it must be listed there first.
      # NuGet's validation and indexing usually take 5-20 minutes.
      - name: Wait for NuGet to index the package
        run: |
          version="${GITHUB_REF_NAME#v}"
          for _ in $(seq 1 120); do
            curl -fsS https://api.nuget.org/v3-flatcontainer/dotnet-coverage-mcp/index.json \
              | jq -e --arg v "$version" '.versions | index($v)' > /dev/null && exit 0
            sleep 30
          done
          echo "::error::NuGet had not indexed $version after 60 minutes. Re-run this job once it has."
          exit 1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Smoke-test the package from nuget.org
        run: bash .github/scripts/smoke-test.sh "${GITHUB_REF_NAME#v}"

  # Jobs of their own so that, if one fails, "Re-run failed jobs" retries only that part,
  # not the NuGet push and the GitHub Release that already succeeded.
  mcp-registry:
    needs: verify-nuget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # `mcp-publisher login github-oidc`
    env:
      # Pinned and signature-checked, as the registry's guide recommends. Bump on purpose.
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Download and verify mcp-publisher
        run: |
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base_url/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      # Log in right before publishing: the registry token lasts only a few minutes.
      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
