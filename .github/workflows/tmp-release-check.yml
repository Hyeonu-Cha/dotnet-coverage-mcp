# TEMPORARY: runs the new release steps on this PR before a real tag needs them.
# Attests a throwaway 0.0.0-ci package, then verifies it. Removed before merge.
name: tmp-release-check

on: pull_request

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: dotnet pack DotNetCoverageMcp.csproj --configuration Release -p:Version=0.0.0-ci -p:IsPacking=true -o ./nupkg

      - name: Generate SBOM
        env:
          VERSION: 0.0.0-ci
        run: |
          dotnet tool install CycloneDX --version 6.3.1 --tool-path "$RUNNER_TEMP/cyclonedx"
          "$RUNNER_TEMP/cyclonedx/dotnet-CycloneDX" DotNetCoverageMcp.csproj --output ./sbom \
            --output-format Json --filename "dotnet-coverage-mcp.$VERSION.cdx.json" \
            --set-name dotnet-coverage-mcp --set-version "$VERSION" --set-type Application \
            --exclude-dev --exclude-test-projects

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ./nupkg/*.nupkg

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ./nupkg/*.nupkg
          sbom-path: ./sbom/dotnet-coverage-mcp.0.0.0-ci.cdx.json

      - name: Verify both attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify ./nupkg/dotnet-coverage-mcp.0.0.0-ci.nupkg --repo "$GITHUB_REPOSITORY"
          gh attestation verify ./nupkg/dotnet-coverage-mcp.0.0.0-ci.nupkg --repo "$GITHUB_REPOSITORY" --predicate-type https://cyclonedx.org/bom

      - name: Smoke-test 2.0.3 from nuget.org
        run: bash .github/scripts/smoke-test.sh 2.0.3
