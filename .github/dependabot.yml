version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - nuget
    # One PR per week for routine bumps; majors still arrive individually.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Microsoft.Extensions.* majors follow .NET's: 11.x targets .NET 11, while the tool stays
    # on .NET 10 (LTS) and net10.0. Moved together with the target framework, on purpose.
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns: ["*"]
